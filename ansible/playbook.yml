---
- name: Configure the foundation assessment runtime
  hosts: app
  become: true
  vars:
    app_user: aptitude
    app_dir: /opt/aptitude-test
    session_secret: change-this-before-a-real-deployment
    counsellor_email: counsellor@local.test
    counsellor_password: ChangeMe123
    app_release: "1.0.0"

  tasks:
    - name: Install packages the service needs
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - python3
          - docker.io
        state: present
        update_cache: true

    - name: Start Docker and enable it on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Write the runtime environment file
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
