apiVersion: apps/v1
kind: Deployment
metadata:
  name: aptitude-test
  namespace: aptitude
  labels:
    app: aptitude-test
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aptitude-test
  template:
    metadata:
      labels:
        app: aptitude-test
    spec:
      containers:
        - name: app
          image: aptitude-test:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: aptitude-test-env
          env:
            - name: APP_RELEASE
              value: "1.0.0"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
