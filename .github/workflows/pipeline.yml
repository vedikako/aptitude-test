name: Foundation assessment pipeline

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Install, check, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      SESSION_SECRET: ci-session-secret-not-for-production
      COUNSELLOR_EMAIL: counsellor@local.test
      COUNSELLOR_PASSWORD: ChangeMe123
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build the Next.js app
        run: npm run build

  image:
    name: Build the container image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aptitude-test:ci
